<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala EBI - Turnos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/calendar.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div class="header">
    <span id="user-info"></span>
    <div class="header-buttons">
      <div class="admin-controls" id="admin-controls">
        <div class="file-input-wrapper">
          <input type="file" id="btnImportar" accept=".csv">
          <label for="btnImportar">📤 Importar CSV</label>
        </div>
        <button id="btnExportar">📥 Exportar CSV</button>
        <button id="btnLimpiar" style="background: #e74c3c;">🗑️ Limpiar Todo</button>
      </div>

      <!-- Nuevo botón para ir al Calendario -->
      <button id="btnCalendar" title="Ver calendario" style="background: #6c5ce7; margin-right:8px;">
        📅 Ver calendario
      </button>

      <button id="btnGuardarCambios" disabled style="background: #27ae60; opacity: 0.5;">
        💾 Guardar Cambios <span id="contador-cambios" style="display:none;"></span>
      </button>
      <button id="btnLogout">🚪 Salir</button>
    </div>
  </div>
  
  <div id="turnos-container"></div>

  <!-- Modal de Confirmación -->
  <div id="modal-confirmacion" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚠️ ATENCIÓN</h2>
        <p>Estás anotándote para las siguientes escalas:</p>
      </div>
      <div class="modal-body">
        <div id="tabla-para-captura">
          <table class="modal-table">
            <thead>
              <tr>
                <th>Día</th>
                <th>Fecha</th>
                <th>Horario</th>
                <th>Sala</th>
                <th>Rol</th>
                <th>Nombre</th>
              </tr>
            </thead>
            <tbody id="modal-turnos-lista">
              <!-- Los turnos se insertan aquí dinámicamente -->
            </tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button id="btnModalModificar" class="modal-btn modal-btn-modificar">✏️ Modificar</button>
          <button id="btnModalAceptar" class="modal-btn modal-btn-aceptar">✅ Aceptar</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // abrir calendario al hacer click
    document.addEventListener('DOMContentLoaded', function() {
      const btnCalendar = document.getElementById('btnCalendar');
      btnCalendar.addEventListener('click', () => {
        window.location.href = '/calendar.html';
      });
    });
  </script>

  <script src="js/nameStore.js"></script>
  <script src="script-frontend.js"></script>
</body>
</html>
