<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala EBI - Turnos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/calendar.css">
  <style>
    /* Modal styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 20px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: modalSlideIn 0.3s ease-out;
    }
    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .modal-header {
      background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
      color: white;
      padding: 20px 25px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-body {
      padding: 20px 25px;
      max-height: 50vh;
      overflow-y: auto;
    }
    .modal-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    .modal-table th,
    .modal-table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }
    .modal-table th {
      background: #f8f9fa;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    .modal-table td {
      font-size: 14px;
      color: #555;
    }
    .modal-table tr:hover {
      background: #f8f9fa;
    }
    .modal-table .rol-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 600;
    }
    .modal-table .rol-titular {
      background: #667eea;
      color: white;
    }
    .modal-table .rol-auxiliar {
      background: #27ae60;
      color: white;
    }
    .modal-footer {
      padding: 20px 25px;
      background: #f8f9fa;
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      flex-wrap: wrap;
    }
    .modal-btn {
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .modal-btn-cancel {
      background: #95a5a6;
      color: white;
    }
    .modal-btn-cancel:hover {
      background: #7f8c8d;
      transform: translateY(-2px);
    }
    .modal-btn-confirm {
      background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
      color: white;
    }
    .modal-btn-confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(39, 174, 96, 0.4);
    }
    .modal-summary {
      background: #e8f5e9;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
    }
    .modal-summary strong {
      color: #27ae60;
      font-size: 18px;
    }
    @media (max-width: 600px) {
      .modal-content {
        border-radius: 15px;
      }
      .modal-table th,
      .modal-table td {
        padding: 8px 10px;
        font-size: 12px;
      }
      .modal-footer {
        flex-direction: column;
      }
      .modal-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <span id="user-info"></span>
    <div class="header-buttons">
      <div class="admin-controls" id="admin-controls">
        <div class="file-input-wrapper">
          <input type="file" id="btnImportar" accept=".csv">
          <label for="btnImportar">📤 Importar CSV</label>
        </div>
        <button id="btnExportar">📥 Exportar CSV</button>
        <button id="btnLimpiar" style="background: #e74c3c;">🗑️ Limpiar Todo</button>
      </div>

      <!-- Nuevo botón para ir al Calendario -->
      <button id="btnCalendar" title="Ver calendario" style="background: #6c5ce7; margin-right:8px;">
        📅 Ver calendario
      </button>

      <button id="btnGuardarCambios" disabled style="background: #27ae60; opacity: 0.5;">
        💾 Guardar Cambios <span id="contador-cambios" style="display:none;"></span>
      </button>
      <button id="btnLogout">🚪 Salir</button>
    </div>
  </div>
  
  <div id="turnos-container"></div>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚠️ ATENCIÓN: estás anotándote para las siguientes escalas</h2>
      </div>
      <div class="modal-body">
        <div class="modal-summary">
          Te estás anotando en <strong id="modal-count">0</strong> turno(s)
        </div>
        <table class="modal-table">
          <thead>
            <tr>
              <th>Día</th>
              <th>Fecha</th>
              <th>Horario</th>
              <th>Sala</th>
              <th>Rol</th>
            </tr>
          </thead>
          <tbody id="modal-turnos-body">
          </tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button id="btnModalCancel" class="modal-btn modal-btn-cancel">Modificar</button>
        <button id="btnModalConfirm" class="modal-btn modal-btn-confirm">✓ Aceptar</button>
      </div>
    </div>
  </div>
  
  <script>
    // abrir calendario al hacer click
    document.addEventListener('DOMContentLoaded', function() {
      const btnCalendar = document.getElementById('btnCalendar');
      btnCalendar.addEventListener('click', () => {
        window.location.href = '/calendar.html';
      });
    });
  </script>

  <script src="script-frontend.js"></script>
</body>
</html>
